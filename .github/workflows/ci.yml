name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run legal:check
      # PROD-03-03: the committed release manifest and the frozen API surface
      # must match this build (verify-release-manifest.mjs, check-api-freeze.mjs).
      - run: npm run check:release-coherence

  pilot-deployment:
    # PROD-03-03: the supported pilot deployment (Dockerfile + deploy/pilot),
    # qualified end to end from a clean export of this commit: build, config
    # check, start, readiness, release identity, durable state across restarts,
    # storage/schema/witness faults, secret leakage and image hygiene (D1-D15).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/deploy/qualify-pilot-deployment.mjs --commit "$(git rev-parse HEAD)"

  pilot-acceptance:
    # PROD-03-04: the pilot operations runbooks, executed as written against a
    # clean export of this commit (startup, shutdown, restart, backup, restore,
    # upgrade/rollback commands, degraded and required-failure behaviour,
    # operator resolution, emergency control, evidence and secret hygiene:
    # O1-O15), plus the PROD-03-02 in-process resolution suite (--host-build).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/deploy/qualify-pilot-acceptance.mjs --commit "$(git rev-parse HEAD)" --host-build
