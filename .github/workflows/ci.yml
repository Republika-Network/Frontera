name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    # CI compatibility (temporary, founder-approved 2026-10-24): ubuntu-latest moved to
    # ubuntu-26.04, whose temporary directory is tmpfs. The production profile's storage
    # preflight correctly refuses durable stores on an in-memory filesystem
    # (STORAGE_NOT_PERSISTENT), and this job's suites keep secure-profile state under the
    # OS temporary directory. Pinned until those suites place durable state on disk.
    # The refusal itself stays qualified (pilot-deployment D8: state on a tmpfs mount is refused).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run legal:check
      # PROD-03-03: the committed release manifest and the frozen API surface
      # must match this build (verify-release-manifest.mjs, check-api-freeze.mjs).
      - run: npm run check:release-coherence

  pilot-deployment:
    # PROD-03-03: the supported pilot deployment (Dockerfile + deploy/pilot),
    # qualified end to end from a clean export of this commit: build, config
    # check, start, readiness, release identity, durable state across restarts,
    # storage/schema/witness faults, secret leakage and image hygiene (D1-D15).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/deploy/qualify-pilot-deployment.mjs --commit "$(git rev-parse HEAD)"

  pilot-acceptance:
    # PROD-03-04: the pilot operations runbooks, executed as written against a
    # clean export of this commit (startup, shutdown, restart, backup, restore,
    # upgrade/rollback commands, degraded and required-failure behaviour,
    # operator resolution, emergency control, evidence and secret hygiene:
    # O1-O15), plus the PROD-03-02 in-process resolution suite (--host-build).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/deploy/qualify-pilot-acceptance.mjs --commit "$(git rev-parse HEAD)" --host-build

  pilot-operations:
    # PROD-03: the pilot qualification — the clean-room pilot drill and the
    # signer drill on real processes (Host from a staged release, reference
    # witness, web console, reference target), the readiness gate, the pilot
    # structure suite and the approvalPolicy / witness-outage suites. The
    # multi-process drills run here, one file at a time, not inside the
    # parallel root suite of `validate`.
    # CI compatibility (temporary, founder-approved 2026-10-24): ubuntu-latest moved to
    # ubuntu-26.04, whose temporary directory is tmpfs. The production profile's storage
    # preflight correctly refuses durable stores on an in-memory filesystem
    # (STORAGE_NOT_PERSISTENT), and this job's suites keep secure-profile state under the
    # OS temporary directory. Pinned until those suites place durable state on disk.
    # The refusal itself stays qualified (pilot-deployment D8: state on a tmpfs mount is refused).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run qualify:pilot

  demo-evidence:
    # DEMO-01A: one run of the reference implementation for the three DEMO-01
    # scenarios (authorized, blocked, uncertain) on the shipped Host and the
    # reference executor, captured as `frontera.demo-evidence-bundle.v1` and
    # uploaded as a downloadable artifact. Test-only and synthetic: no secret,
    # no write permission, no release, package or deployment. The same test runs
    # inside `validate` (npm test) without writing anything.
    # ubuntu-24.04 for the same reason as `validate`: the production profile's
    # storage preflight refuses durable state on ubuntu-26.04's tmpfs /tmp.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Capture the reference evidence
        env:
          FRONTERA_DEMO01_EVIDENCE_OUT: ${{ runner.temp }}/demo01-evidence/frontera-demo-evidence-bundle.v1.json
          FRONTERA_DEMO01_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test --test-reporter=spec dist/src/enterprise/__tests__/demo01-evidence-capture.test.js
      - name: Digest the bundle
        working-directory: ${{ runner.temp }}/demo01-evidence
        run: |
          test -s frontera-demo-evidence-bundle.v1.json
          sha256sum frontera-demo-evidence-bundle.v1.json | tee frontera-demo-evidence-bundle.v1.json.sha256
          {
            echo '### DEMO-01A reference evidence'
            echo
            echo 'Synthetic reference-implementation output (frontera.demo-evidence-bundle.v1). Not production evidence.'
            echo
            echo '```'
            cat frontera-demo-evidence-bundle.v1.json.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: frontera-demo01-reference-evidence-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo01-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Record the artifact
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "artifact: ${ARTIFACT_URL}"
          echo "artifact zip digest: ${ARTIFACT_DIGEST}"
          echo "- Artifact: ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact zip digest: ${ARTIFACT_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  authority-pilot-config:
    # AUTH-04D2A: the synthetic Authority pilot's deployment configuration
    # (deploy/authority-pilot/), qualified with no cloud resource, DNS name,
    # real certificate or secret: the Compose overlays as Compose resolves them,
    # then each machine's nginx ingress (the distribution package, as the
    # runbook installs it, with a throwaway self-signed certificate) against a
    # stub upstream on loopback. Not a deployment. AUTH-04D2S adds the synthetic
    # executor overlay and its TLS front on the Host machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:authority-web
      - name: Compose overlays resolve as intended (nothing is built, pulled or started)
        run: |
          cp deploy/authority-pilot/host.env.example deploy/pilot/.env
          cp deploy/authority-pilot/witness.env.example "$RUNNER_TEMP/witness.env"
          # Synthetic values where the templates hold placeholders the configuration's syntax depends on.
          sed -i "s#^AOC_ENTERPRISE_AUTHORITY_FRESHNESS_ENDPOINT=.*#AOC_ENTERPRISE_AUTHORITY_FRESHNESS_ENDPOINT='https://frontera-witness.invalid'#" deploy/pilot/.env
          sed -i "s#^FRONTERA_WITNESS_DATA_DIR=.*#FRONTERA_WITNESS_DATA_DIR=/srv/frontera-witness-ci#" "$RUNNER_TEMP/witness.env"
          # Every PROD-03 profile is enabled on the Host side: a service hidden behind a profile still counts.
          host="docker compose -f deploy/pilot/compose.yaml -f deploy/authority-pilot/compose.host.yaml --profile tools --profile reference-witness"
          $host config --format json > "$RUNNER_TEMP/host.json"
          $host -f deploy/authority-pilot/compose.authority.yaml config --format json > "$RUNNER_TEMP/cutover.json"
          docker compose -f deploy/authority-pilot/compose.witness.yaml --env-file "$RUNNER_TEMP/witness.env" --profile tools config --format json > "$RUNNER_TEMP/witness.json"
          node scripts/deploy/qualify-authority-pilot.mjs compose host "$RUNNER_TEMP/host.json"
          node scripts/deploy/qualify-authority-pilot.mjs compose cutover "$RUNNER_TEMP/cutover.json"
          node scripts/deploy/qualify-authority-pilot.mjs compose witness "$RUNNER_TEMP/witness.json"
          # The witness services cannot be invoked through the Host project (dry run: nothing is created).
          for service in witness-init authority-witness; do
            if $host --dry-run run --rm --no-deps "$service" > "$RUNNER_TEMP/invoke.log" 2>&1; then cat "$RUNNER_TEMP/invoke.log"; echo "::error::$service can be run on the Host"; exit 1; fi
            grep -q "no such service: $service" "$RUNNER_TEMP/invoke.log" || { cat "$RUNNER_TEMP/invoke.log"; exit 1; }
            echo "  ok  Host: run $service -> no such service"
          done
          # Adversarial regression: the Host overlay without its isolation (every `!reset` line,
          # i.e. the overlay as first proposed) must be refused on its resolved form.
          grep -v '!reset' deploy/authority-pilot/compose.host.yaml > deploy/authority-pilot/compose.host.unisolated.yaml
          docker compose -f deploy/pilot/compose.yaml -f deploy/authority-pilot/compose.host.unisolated.yaml --profile tools --profile reference-witness config --format json > "$RUNNER_TEMP/unisolated.json"
          rm deploy/authority-pilot/compose.host.unisolated.yaml
          if node scripts/deploy/qualify-authority-pilot.mjs compose host "$RUNNER_TEMP/unisolated.json" > "$RUNNER_TEMP/unisolated.log" 2>&1; then cat "$RUNNER_TEMP/unisolated.log"; echo "::error::the unisolated Host configuration was accepted"; exit 1; fi
          grep -q 'FAIL — Host: no witness-init service' "$RUNNER_TEMP/unisolated.log" || { cat "$RUNNER_TEMP/unisolated.log"; exit 1; }
          echo "  ok  the unisolated Host configuration is refused: $(grep FAIL "$RUNNER_TEMP/unisolated.log")"
          # AUTH-04D2S: stage 3 (the synthetic executor) on top of the cutover, every profile enabled. Public, synthetic values only.
          printf '%s\n' "FRONTERA_SYNTHETIC_EXECUTION_DIR=/srv/frontera-synthetic-execution-ci" "FRONTERA_SYNTHETIC_EXECUTOR_TOKEN=synthetic-ci-not-a-secret" "AOC_ENTERPRISE_AUTHORITY_VERIFICATION_KEYS='[]'" >> deploy/pilot/.env
          $host -f deploy/authority-pilot/compose.authority.yaml -f deploy/authority-pilot/compose.executor.yaml config --format json > "$RUNNER_TEMP/executor.json"
          node scripts/deploy/qualify-authority-pilot.mjs compose executor "$RUNNER_TEMP/executor.json"
          # Stage 1 and the cutover stay exactly as they were: the executor exists only with its overlay.
          node -e 'const m=require(process.argv[1]); if (Object.keys(m.services).some((n)=>n.includes("executor")||n==="execution-init")) { console.error("executor service outside its overlay"); process.exit(1); }' "$RUNNER_TEMP/cutover.json"
          echo "  ok  without compose.executor.yaml there is no executor service"
          rm deploy/pilot/.env
      - name: Install nginx from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          nginx -v
      - name: Host machine ingress, installed as the runbook installs it
        run: |
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo mkdir -p /etc/nginx/frontera /srv/frontera-authority-web /var/www/frontera-acme /etc/letsencrypt/live/authority.frontera-systems.com
          sudo cp deploy/authority-pilot/nginx/authority.conf /etc/nginx/conf.d/frontera-authority.conf
          sudo cp deploy/authority-pilot/nginx/authority-gateway-proxy.conf deploy/authority-pilot/nginx/authority-web-headers.conf /etc/nginx/frontera/
          sudo cp -r apps/authority-web/dist/. /srv/frontera-authority-web/
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=authority.frontera-systems.com" -addext "subjectAltName=DNS:authority.frontera-systems.com" -keyout /etc/letsencrypt/live/authority.frontera-systems.com/privkey.pem -out /etc/letsencrypt/live/authority.frontera-systems.com/fullchain.pem
          sudo install -m 644 /etc/letsencrypt/live/authority.frontera-systems.com/fullchain.pem "$RUNNER_TEMP/authority-ca.pem"
          sudo nginx -t
          sudo systemctl restart nginx
          node scripts/deploy/qualify-authority-pilot.mjs ingress --ca "$RUNNER_TEMP/authority-ca.pem"
          sudo install -m 644 /var/log/nginx/frontera-authority.access.log "$RUNNER_TEMP/authority-access.log"
          node scripts/deploy/qualify-authority-pilot.mjs logs "$RUNNER_TEMP/authority-access.log"
      - name: Synthetic executor front on the Host machine, beside the Authority ingress (AUTH-04D2S)
        run: |
          sudo mkdir -p /etc/letsencrypt/live/synthetic-executor.frontera-systems.com
          sudo cp deploy/authority-pilot/nginx/synthetic-executor.conf /etc/nginx/conf.d/frontera-synthetic-executor.conf
          sudo cp deploy/authority-pilot/nginx/synthetic-executor-allowlist.conf /etc/nginx/frontera/
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=synthetic-executor.frontera-systems.com" -addext "subjectAltName=DNS:synthetic-executor.frontera-systems.com" -keyout /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/privkey.pem -out /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/fullchain.pem
          sudo cat /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/fullchain.pem "$RUNNER_TEMP/authority-ca.pem" > "$RUNNER_TEMP/host-cas.pem"
          sudo nginx -t
          sudo systemctl restart nginx
          node scripts/deploy/qualify-authority-pilot.mjs executor --ca "$RUNNER_TEMP/host-cas.pem"
          sudo install -m 644 /var/log/nginx/frontera-synthetic-executor.access.log "$RUNNER_TEMP/executor-access.log"
          node scripts/deploy/qualify-authority-pilot.mjs logs "$RUNNER_TEMP/executor-access.log"
          sudo rm -f /etc/nginx/conf.d/frontera-synthetic-executor.conf
      - name: Witness machine ingress (the Host ingress removed first; they are different machines)
        run: |
          sudo rm -f /etc/nginx/conf.d/frontera-authority.conf
          sudo mkdir -p /etc/letsencrypt/live/frontera-witness.invalid
          sudo cp deploy/authority-pilot/nginx/witness.conf /etc/nginx/conf.d/frontera-witness.conf
          sudo cp deploy/authority-pilot/nginx/witness-allowlist.conf /etc/nginx/frontera/
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=frontera-witness.invalid" -addext "subjectAltName=DNS:frontera-witness.invalid" -keyout /etc/letsencrypt/live/frontera-witness.invalid/privkey.pem -out /etc/letsencrypt/live/frontera-witness.invalid/fullchain.pem
          sudo install -m 644 /etc/letsencrypt/live/frontera-witness.invalid/fullchain.pem "$RUNNER_TEMP/witness-ca.pem"
          sudo nginx -t
          sudo systemctl restart nginx
          node scripts/deploy/qualify-authority-pilot.mjs witness --ca "$RUNNER_TEMP/witness-ca.pem"

  authority-web-preview:
    # AUTH-04C: reproducible build of the Frontera Authority web client (static
    # files, browser ES modules) and a private CI artifact for review. Not a
    # deployment: no hosting, DNS, TLS or public URL. The client's behaviour is
    # qualified by the suites in `npm test` (validate).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:authority-web
      - name: Verify the build is reproducible
        run: |
          cp apps/authority-web/dist/asset-manifest.json "$RUNNER_TEMP/first-manifest.json"
          npm run build:authority-web
          diff "$RUNNER_TEMP/first-manifest.json" apps/authority-web/dist/asset-manifest.json
          {
            echo '### AUTH-04C Authority web client (CI preview artifact, not deployed)'
            echo
            echo '```'
            sha256sum apps/authority-web/dist/asset-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frontera-authority-web-preview-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: apps/authority-web/dist/
          if-no-files-found: error
          retention-days: 30
