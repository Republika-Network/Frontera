# Frontera Authority synthetic pilot — the WITNESS machine's ingress (AUTH-04D2A).
#
# TLS in front of the reference witness (loopback 127.0.0.1:8444), for the
# Host machine only. The witness authenticates the Host's credential and signs
# every receipt with the key the Host pins; this file adds transport secrecy
# and the network allow-list. Nothing else is served from this machine.
#
# Install, with the operating system's own nginx package:
#   /etc/nginx/conf.d/frontera-witness.conf          <- this file
#   /etc/nginx/frontera/witness-allowlist.conf        <- the Host machine's address(es)
#   /etc/letsencrypt/live/<witness host name>/        <- the certificate, issued at cutover
# Replace frontera-witness.invalid below with the witness host name
# (runbook step 2). The machine firewall admits 443 from the Host machine only.

log_format frontera_witness '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frontera-acme;
    }
    location / {
        return 444;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontera-witness.invalid;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/frontera-witness.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontera-witness.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    access_log /var/log/nginx/frontera-witness.access.log frontera_witness;

    include /etc/nginx/frontera/witness-allowlist.conf;

    # The witness protocol's fixed paths only (/v2/identity, /v2/checkpoint/*).
    location ^~ /v2/ {
        limit_except POST GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location / {
        return 404;
    }
}
