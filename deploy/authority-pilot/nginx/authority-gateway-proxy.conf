# Frontera Authority synthetic pilot — the one way to the Authority gateway (AUTH-04D2A).
# Included by authority.conf for /authority/v1/ only.
#
# Host is preserved; Origin, Cookie, Content-Type, x-frontera-csrf-token and
# Authorization pass unchanged (nginx forwards request headers as received), so
# the gateway's own Host (421), Origin (403) and bearer (400) refusals stay in
# force. Responses pass unchanged, every Set-Cookie included. Nothing is cached.
limit_except GET POST {
    deny all;
}
proxy_pass http://127.0.0.1:8788;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_redirect off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_send_timeout 10s;
proxy_read_timeout 30s;
