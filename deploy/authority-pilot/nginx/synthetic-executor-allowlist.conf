# The synthetic executor's front admits the Host container alone: it dials this
# machine's own public address from its Docker bridge network (Docker's default
# address pools). Nothing on the internet can source these addresses here, and
# the cloud firewall keeps port 8443 closed in any case. Loopback is admitted
# for the operator's own checks on this machine.
allow 127.0.0.1;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
