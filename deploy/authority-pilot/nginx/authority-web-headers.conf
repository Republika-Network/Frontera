# Frontera Authority synthetic pilot — the static client's response headers (AUTH-04D2A).
# Generated from apps/authority-web/security-headers.json, which owns them; a
# structure test fails if the two differ. `always`: on error answers too.
add_header content-security-policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header strict-transport-security "max-age=31536000" always;
add_header x-content-type-options "nosniff" always;
add_header x-frame-options "DENY" always;
add_header referrer-policy "no-referrer" always;
add_header cross-origin-opener-policy "same-origin" always;
add_header cross-origin-resource-policy "same-origin" always;
add_header permissions-policy "camera=(), microphone=(), geolocation=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header cache-control "no-cache" always;
