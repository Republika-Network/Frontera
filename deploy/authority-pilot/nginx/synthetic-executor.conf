# Frontera Authority synthetic pilot — the synthetic executor's TLS front (AUTH-04D2S).
#
# On the HOST machine, beside authority.conf, only with compose.executor.yaml.
# The Host's capability-gated Generic HTTP adapter speaks HTTPS to a public DNS
# name and refuses loopback and private targets by design (G-02C0); the
# synthetic executor listens on loopback only (G-02C1A). This front joins them
# without changing either: `synthetic-executor.frontera-systems.com` resolves to
# this machine, port 8443 terminates TLS, and the request goes on unchanged to
# 127.0.0.1:8445.
#
# It is not a public endpoint:
#   - the cloud firewall keeps 8443 closed (only 22 from the founder, 80 and 443
#     are open), so only this machine reaches it;
#   - synthetic-executor-allowlist.conf admits this machine's own Docker bridge
#     (where the Host container dials from) and nothing else;
#   - it serves one path prefix and one method; nothing else on this port, and
#     the Authority ingress (authority.conf) has no route here.
# Port 80 answers this name for the ACME HTTP-01 challenge only.
#
# Install, with the operating system's own nginx package:
#   /etc/nginx/conf.d/frontera-synthetic-executor.conf     <- this file
#   /etc/nginx/frontera/synthetic-executor-allowlist.conf   <- the allow-list
#   /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/

log_format frontera_executor '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name synthetic-executor.frontera-systems.com;
    server_tokens off;
    access_log /var/log/nginx/frontera-synthetic-executor.access.log frontera_executor;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frontera-acme;
    }
    location / {
        return 444;
    }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name synthetic-executor.frontera-systems.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetic-executor.frontera-systems.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    access_log /var/log/nginx/frontera-synthetic-executor.access.log frontera_executor;

    include /etc/nginx/frontera/synthetic-executor-allowlist.conf;

    # The adapter's one path (/v1/deployments/<resource>) and one method. Every
    # header and byte passes unchanged: the executor rebuilds the request
    # binding from exactly what it receives, so Host (with its port) is kept.
    location ^~ /v1/deployments/ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8445;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
    location / {
        return 404;
    }
}
