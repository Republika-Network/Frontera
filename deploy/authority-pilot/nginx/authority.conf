# Frontera Authority synthetic pilot — the HOST machine's ingress (AUTH-04D2A).
#
# Implements deploy/authority-pilot/ingress-contract.json for
# https://authority.frontera-systems.com, and nothing else. Qualified in CI
# against a stub gateway by scripts/deploy/qualify-authority-ingress.mjs.
#
# Install (runbook step 2), with the operating system's own nginx package:
#   /etc/nginx/conf.d/frontera-authority.conf    <- this file
#   /etc/nginx/frontera/                          <- authority-gateway-proxy.conf, authority-web-headers.conf
#   /srv/frontera-authority-web/                  <- apps/authority-web/dist (asset-manifest.json checked)
#   /etc/letsencrypt/live/authority.frontera-systems.com/  <- the certificate, issued at cutover
#
# Two routes only: /authority/v1/ to the gateway on loopback, everything else
# to the static client. The Host's main listener (operator plane, health,
# governed actions), the witness, the signer and the backup storage are never
# routed from here. No CORS header, ever.

# Never a cookie, a query string, a body, a CSRF token or an Authorization value.
log_format frontera_authority '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

# Per TCP peer; a client-supplied X-Forwarded-For is never consulted.
limit_req_zone $binary_remote_addr zone=frontera_authority_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=frontera_authority_enrolment:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=frontera_authority_api:10m rate=120r/m;

# Any other name, or none: no certificate is presented and no answer is given.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/frontera-authority.access.log frontera_authority;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log /var/log/nginx/frontera-authority.access.log frontera_authority;
    return 444;
}

# Plain HTTP: the ACME challenge, otherwise a redirect. No cookie, no content.
server {
    listen 80;
    listen [::]:80;
    server_name authority.frontera-systems.com;
    server_tokens off;
    access_log /var/log/nginx/frontera-authority.access.log frontera_authority;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frontera-acme;
    }
    location / {
        return 301 https://authority.frontera-systems.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name authority.frontera-systems.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/authority.frontera-systems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/authority.frontera-systems.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # The gateway's own bound (64 KiB); a larger body is refused here, never forwarded.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;

    access_log /var/log/nginx/frontera-authority.access.log frontera_authority;

    # ---- the Authority API: to the gateway, Host and Origin exactly as sent ----
    location ^~ /authority/v1/session/login {
        limit_req zone=frontera_authority_login burst=5 nodelay;
        include /etc/nginx/frontera/authority-gateway-proxy.conf;
    }
    location ^~ /authority/v1/enrolment {
        limit_req zone=frontera_authority_enrolment burst=3 nodelay;
        include /etc/nginx/frontera/authority-gateway-proxy.conf;
    }
    location ^~ /authority/v1/ {
        limit_req zone=frontera_authority_api burst=20 nodelay;
        include /etc/nginx/frontera/authority-gateway-proxy.conf;
    }

    # ---- the static web client: the reproducible build, nothing else ----
    location = /security-headers.json {
        return 404;
    }
    location / {
        limit_except GET {
            deny all;
        }
        root /srv/frontera-authority-web;
        index index.html;
        try_files $uri $uri/ =404;
        autoindex off;
        include /etc/nginx/frontera/authority-web-headers.conf;
    }
}
